name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test with race detector
        run: go test ./... -race -count=1

      - name: Test coverage
        run: go test ./... -coverprofile=coverage.out .

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      # config is v2-format; pin the matching major so a v1 binary never
      # rejects it (the preinstalled runner version may lag)
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13
          args: --timeout=5m
