# golangci-lint v2 configuration for stream processing library
# Reference: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  # Timeout for analysis, e.g., 30s, 5m
  timeout: 5m

# Linters configuration
linters:
  # Enable specific linters
  enable:
    # Code quality
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Style and formatting
    - gocritic
    - gocyclo
    - misspell
    - prealloc
    - unconvert
    - unparam

    # Performance
    - bodyclose
    - nilerr
    - noctx
    - rowserrcheck

    # Additional checks
    - dupl
    - funlen
    - goconst
    - nestif

  # All available settings of specific linters
  settings:
    # Security checks
    gosec:
      # Exclude weak random number generator warnings for non-cryptographic use
      excludes:
        - G404

  exclusions:
    # Which dirs to skip
    paths:
      - tests
      - vendor

    rules:
      # Exclude some linters from running on tests files
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - funlen

      # Exclude unused function in helper files
      - path: helper\.go
        linters:
          - unused

      # Exclude variable declarations that are explicit for clarity in generic code
      - linters:
          - staticcheck
        text: "ST1023"

      # Exclude weak random number generator warnings for non-cryptographic use
      - linters:
          - gosec
        text: "G404"

issues:
  # Maximum issues count per one linter. Set to 0 to disable
  max-issues-per-linter: 0

  # Maximum count of issues with the same text. Set to 0 to disable
  max-same-issues: 0
