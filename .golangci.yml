# golangci-lint v2 configuration for stream processing library
# Reference: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  # Timeout for analysis, e.g., 30s, 5m
  timeout: 5m

# Linters configuration
linters:
  # v2 defaults kept explicit: errcheck, govet, ineffassign, staticcheck, unused
  enable:
    # Code quality (v2 defaults, explicit for stability across major versions)
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Style and simplification
    - gocritic
    - gocyclo
    - misspell
    - prealloc
    - unconvert
    - unparam

    # Correctness and safety
    - gosec
    - nilerr

    # Additional checks
    - dupl
    - funlen
    - goconst
    - nestif

    # Modernization guards (keep code at current Go idioms)
    - copyloopvar
    - intrange

    # Performance (fits a performance-sensitive library)
    - perfsprint

  settings:
    gosec:
      # math/rand/v2 in Take() is intentionally non-cryptographic
      excludes:
        - G404

  exclusions:
    # Exercise-style scratch dir, not library code
    paths:
      - tests

    rules:
      # Relax noisy linters on test files
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - funlen

issues:
  # Show every issue instead of truncating (0 disables the limits)
  max-issues-per-linter: 0
  max-same-issues: 0
